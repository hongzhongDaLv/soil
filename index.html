<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土样管理系统 · 新入口</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3f6fa;color:#244764;font:16px/1.7 Arial,"Microsoft YaHei",sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(100%,560px);background:white;border:1px solid #d6e1ec;border-radius:20px;padding:28px}h1{font-size:25px}a,button{display:inline-block;border:1px solid #c6d7e6;border-radius:9px;padding:11px 16px;color:#285e8e;text-decoration:none;background:#fff;font:inherit;cursor:pointer}a{background:#2a6ab0;color:white}.hint{font-size:14px;color:#647c92}#backups button{display:block;width:100%;margin:8px 0;text-align:left}</style><main><h1>土样管理系统</h1><p>已启用姓名＋课题组口令登录，请使用新入口。</p><p><a href="https://soil-sync.pages.dev/">进入登录版</a></p><div id="local"><p class="hint">正在检查此浏览器的旧版本机副本…</p></div><div id="backups"></div><p class="hint">旧地址不再保存或同步。已有云端数据会在新入口登录后读取；旧页面未同步的记录和草稿，可先下载 JSON 备份，再在新入口的“数据与设置”导入核对。</p></main><script>
(async()=>{const text=document.querySelector('#local'),box=document.querySelector('#backups');try{if(indexedDB.databases&&!(await indexedDB.databases()).some(x=>x.name==='soil-local-trial-v3')){text.textContent='此浏览器没有检测到旧版本机副本。';return;}const db=await new Promise((res,rej)=>{const r=indexedDB.open('soil-local-trial-v3');r.onupgradeneeded=()=>{r.transaction.abort();rej(Error('没有旧副本'));};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});if(!db.objectStoreNames.contains('datasets')){db.close();text.textContent='没有可导出的土样副本。';return;}const rows=await new Promise((res,rej)=>{const result=[],tx=db.transaction('datasets','readonly'),r=tx.objectStore('datasets').openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return;const st=c.value?.state;if(st?.schema===3&&st.core?.containers)result.push(st);c.continue();};tx.oncomplete=()=>res(result);tx.onerror=()=>rej(tx.error);});db.close();rows.sort((a,b)=>b.revision-a.revision);text.textContent=rows.length?'发现旧版本机副本。如有未同步修改，请先下载备份。':'此浏览器没有可导出的旧版副本。';for(const [i,state]of rows.entries()){const b=document.createElement('button');b.textContent=`下载副本 ${i+1} · 版本 ${state.revision} · ${Object.keys(state.core.containers).length} 个容器${state.draft?' · 含草稿':''}`;b.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='土样旧地址备份_'+state.revision+'_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};box.append(b);}}catch{ text.textContent='本机副本暂时无法读取；请勿清除浏览器数据，可重新打开此页再试。';}})();
</script></html>
